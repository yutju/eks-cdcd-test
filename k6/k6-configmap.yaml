apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-test-script
  namespace: web-apps
data:
  test.js: |
    import http from 'k6/http';
    import { sleep, check } from 'k6';

    export const options = {
      stages: [
        { duration: '1m', target: 100 },   // 워밍업
        { duration: '2m', target: 300 },   // 증가 — KEDA 스케일아웃 유도
        { duration: '3m', target: 300 },   // 유지 — CA 노드 증설까지 확인
        { duration: '1m', target: 0 },     // 감소
      ],
      thresholds: {
        http_req_failed: ['rate<0.01'],    // 에러율 1% 미만
        http_req_duration: ['p(95)<500'],  // p95 500ms 미만
      },
    };

    export default function () {
      // prod app-service를 클러스터 내부 경로로 타격
      const res = http.get('http://app-service.web-apps.svc.cluster.local/');
      check(res, { 'status is 200': (r) => r.status === 200 });
      sleep(0.1);
    }
