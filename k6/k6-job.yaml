apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: web-apps
spec:
  template:
    spec:
      containers:
      - name: k6
        image: grafana/k6
        args: ["run", "/scripts/test.js"]
        volumeMounts:
        - name: k6-script
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: k6-script
        configMap:
          name: k6-load-test-script
  backoffLimit: 0
