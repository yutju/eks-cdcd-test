apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openemr-sqlconf
  namespace: his-emr
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-ssm, kind: ClusterSecretStore }
  target:
    name: openemr-sqlconf
  data:
    - secretKey: sqlconf.php
      remoteRef:
        key: /his-main/his-emr/openemr-sqlconf
