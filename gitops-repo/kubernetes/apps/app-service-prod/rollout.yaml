# Deployment → Argo Rollouts Rollout 전환 (카나리 배포)
# 배포 흐름: 10% 트래픽 → Prometheus 성공률 자동 판정 → 50% → 60초 대기 → 100%
# 판정 실패 시 Rollouts가 즉시 abort하고 트래픽을 stable로 되돌림 (Jenkins가 git revert 수행)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app-service
  namespace: web-apps
spec:
  replicas: 3   # 실제 replica 수는 KEDA가 관리 (Application의 ignoreDifferences로 무시)
  selector:
    matchLabels:
      app: app-service
  template:
    metadata:
      labels:
        app: app-service
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: his-main-ng-service
      containers:
      - name: app-service
        image: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com/web-service/app-image:build-7
        envFrom:                          # [추가] 앱 환경변수 주입 (bootstrap으로 apply되는 Secret)
        - secretRef:
            name: app-service-secret
        ports:
        - name: http          # PodMonitor가 이 이름으로 /metrics를 스크레이프함
          containerPort: 4000
        resources:
          requests: { cpu: "200m", memory: "256Mi" }
          limits:   { cpu: "500", memory: "512Mi" }
        readinessProbe:
          httpGet: { path: /healthz, port: 4000 }
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 10
  strategy:
    canary:
      stableService: app-service           # 기존 Service (stable 파드만 가리키도록 Rollouts가 selector 관리)
      canaryService: app-service-canary    # 신규 Service (카나리 파드만)
      trafficRouting:
        alb:
          ingress: app-service-ingress     # 기존 ALB Ingress — actions annotation으로 가중치 분할
          servicePort: 80
      steps:
        - setWeight: 10
        - analysis:                        # 10% 트래픽 상태에서 성공률 자동 판정 (~2.5분)
            templates:
              - templateName: app-service-success-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: { duration: 60 }
        # 마지막 step 이후 자동으로 100% 전환 + stable 교체
