apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: app-service-gateway
  namespace: app-service-prod # 상용 서비스 네임스페이스
  annotations:
    # 외부 인터넷에서 접속 가능하도록 설정
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # AWS Load Balancer Controller가 이 Gateway를 처리하도록 지정
  gatewayClassName: amazon-alb 
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same # 같은 네임스페이스의 HTTPRoute만 허용 (보안)
  # 상용 서비스이므로 HTTPS 리스너도 추가 (ACM 인증서 세팅 필요)
  # - name: https
  #   protocol: HTTPS
  #   port: 443
  #   tls:
  #     mode: Terminate
  #     certificateRefs:
  #     - name: your-acm-cert-name # K8s Secret으로 매핑된 인증서 또는 어노테이션 활용
