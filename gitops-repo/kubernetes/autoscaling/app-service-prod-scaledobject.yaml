# KEDA ScaledObject: app-service (prod) 파드 스케일링
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: app-service-prod-scaledobject
  namespace: web-apps
spec:
  scaleTargetRef:
    # [카나리] Deployment → Rollout 전환. Rollout도 /scale 서브리소스를
    # 구현하므로 KEDA가 동일하게 스케일링 가능.
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: app-service
  minReplicaCount: 3
  maxReplicaCount: 10
  cooldownPeriod: 60
  triggers:
    # 리소스 기반 (metrics-server) — HPA와 동일
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"
    # [신규] Prometheus 커스텀 메트릭 — 초당 요청수(RPS) 기반.
    #   KEDA가 query 결과(전체 RPS)를 threshold(파드당 목표 RPS)로 나눠 목표 파드 수 계산.
    #   예: 총 500 RPS / threshold 50 → 10개. CPU%가 안 올라도 트래픽이 많으면 확장됨.
    #   → HPA 단독으론(prometheus-adapter 없이) 불가능한 부분 = KEDA를 쓰는 이유.
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
        metricName: app_service_http_rps
        # 전체(stable+canary) RPS 합계. 실제 메트릭 라벨에 맞게 셀렉터 조정 가능.
        query: sum(rate(http_requests_total{namespace="web-apps"}[1m]))
        threshold: "50"        # 파드당 목표 RPS (튜닝 값)

