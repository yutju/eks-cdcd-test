# KEDA ScaledObject: app-service (prod) 파드 스케일링
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: app-service-prod-scaledobject
  namespace: web-apps
spec:
  scaleTargetRef:
    # [카나리] Deployment → Rollout 전환. Rollout도 /scale 서브리소스를
    # 구현하므로 KEDA가 동일하게 스케일링 가능.
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: app-service
  minReplicaCount: 3
  maxReplicaCount: 10
  cooldownPeriod: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"
