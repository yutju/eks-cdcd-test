# gitops-repo/kubernetes/cicd/argocd/bootstrap-edges.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: edge-clusters-appset
  namespace: argocd
spec:
  generators:
    - clusters:
        # edge=true 라벨이 붙은 클러스터만 타겟팅
        selector:
          matchLabels:
            edge: "true"
  template:
    metadata:
      name: '{{name}}-bootstrap'
    spec:
      project: default
      source:
        repoURL: 'http://10.0.4.10:8080/root/gitops-repo.git'
        targetRevision: main
        path: 'clusters/{{name}}/apps'
        helm:
          parameters:
            - name: global.gitlabUrl
              value: 'http://10.0.4.10:8080'
            # 🌟 자식 앱(Falco 등)이 엣지로 찾아갈 수 있도록 목적지 IP를 변수로 전달
            - name: global.edgeApiUrl
              value: '{{server}}'
            - name: global.hubPrometheusUrl
              value: 'http://prometheus.monitoring.local/api/v1/write'
      destination:
        # 🌟 핵심 수정: 부모 앱(Bootstrap 설계서) 자체는 반드시 '허브 클러스터'에 생성되어야 합니다!
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
