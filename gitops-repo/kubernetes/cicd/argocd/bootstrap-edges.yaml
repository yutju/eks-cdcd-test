apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: edge-clusters-appset
  namespace: argocd
spec:
  generators:
    - clusters:
        # edge=true 라벨이 붙은 클러스터만 타겟팅
        selector:
          matchLabels:
            edge: "true"
  template:
    metadata:
      name: '{{name}}-bootstrap'
    spec:
      project: default
      source:
        repoURL: 'http://10.0.4.10:8080/root/gitops-repo.git'
        targetRevision: main
        path: 'clusters/{{name}}/apps'
        helm:
          parameters:
            - name: global.gitlabUrl
              value: 'http://10.0.4.10:8080'
            - name: global.edgeApiUrl
              value: '{{server}}'
            - name: global.hubPrometheusUrl
              value: 'http://prometheus.monitoring.local/api/v1/write'
      destination:
        server: '{{server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
