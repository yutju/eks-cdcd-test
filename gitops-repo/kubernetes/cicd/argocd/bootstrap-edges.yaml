apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: edge-clusters-appset
  namespace: argocd
spec:
  generators:
    - clusters:
        # ArgoCD에 'cluster' 타입으로 등록된 모든 대상을 자동으로 타겟팅
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      # 등록된 클러스터의 이름을 기반으로 앱 생성
      name: '{{name}}-bootstrap'
    spec:
      project: default
      source:
        #  GitLab 외부 인스턴스 IP 주소로 변경
        repoURL: 'http://10.0.4.10:8080/root/gitops-repo.git'
        targetRevision: main
        path: 'clusters/{{name}}/apps' # 클러스터 이름별 폴더 구조 필요 (edge-1, edge-2 등)
        helm:
          parameters:
            #  헬름 파라미터도 외부 IP로 일괄 변경
            - name: global.gitlabUrl
              value: 'http://10.0.4.10:8080'
            - name: global.edgeApiUrl
              value: '{{server}}' 
            - name: global.hubPrometheusUrl
              value: 'http://prometheus.monitoring.local:9090/api/v1/write'
      destination:
        server: '{{server}}' # 등록된 클러스터의 API 서버로 배포
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
