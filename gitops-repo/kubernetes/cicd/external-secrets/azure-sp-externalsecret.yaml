apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azure-sp-secret
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore      # ← 기존 Store 이름으로 교체 (gitlab-api-secret 과 동일하게)
    kind: ClusterSecretStore      # ← 기존이 SecretStore면 SecretStore 로 교체
  target:
    name: azure-sp-secret         # 생성될 K8s Secret 이름 (jenkins-stack.yaml 의 secretKeyRef 와 일치)
    creationPolicy: Owner
  data:
    - secretKey: tenant-id
      remoteRef:
        key: /his-main/azure-sp/tenant-id
    - secretKey: client-id
      remoteRef:
        key: /his-main/azure-sp/client-id
    - secretKey: client-secret
      remoteRef:
        key: /his-main/azure-sp/client-secret
