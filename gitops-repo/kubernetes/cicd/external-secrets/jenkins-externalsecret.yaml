# Jenkins 관련 시크릿 ← AWS SSM /his-main/jenkins/*
# 위치: kubernetes/cicd/external-secrets/jenkins-externalsecret.yaml
#   ※ jenkins-stack / gitlab-api-secret 은 Jenkins 컨트롤러 기동 시점에 필요하므로,
#     ESO(오퍼레이터+SecretStore+ExternalSecret)가 jenkins-stack 앱보다 먼저 동기화돼야 함(sync-wave).
---
# GitLab API 토큰 (jenkins-stack 의 GITLAB_TOKEN_ENV, gitlab-token-id/gitlab-checkout-cred 소스)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-api-secret
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: gitlab-api-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: /his-main/jenkins/gitlab-api-token
---
# Jenkins 관리자 자격증명 (helm admin.existingSecret = "jenkins-stack")
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-stack
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: jenkins-stack
    creationPolicy: Owner
  data:
    - secretKey: jenkins-admin-user
      remoteRef:
        key: /his-main/jenkins/admin-user
    - secretKey: jenkins-admin-password
      remoteRef:
        key: /his-main/jenkins/admin-password
---
# 동일 값의 보조 시크릿 (원본 jenkins-secret.yaml 에 함께 있던 것)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-admin-secret
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: jenkins-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: jenkins-admin-user
      remoteRef:
        key: /his-main/jenkins/admin-user
    - secretKey: jenkins-admin-password
      remoteRef:
        key: /his-main/jenkins/admin-password
