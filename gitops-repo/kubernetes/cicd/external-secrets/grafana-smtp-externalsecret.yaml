apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-smtp-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm            # ← 기존 (Cluster)SecretStore 이름으로 (없으면 아래 3번 먼저)
    kind: ClusterSecretStore
  target:
    name: grafana-smtp-secret   # 원본과 동일한 이름 → grafana가 그대로 참조
    creationPolicy: Owner
  data:
    - secretKey: smtp-password        # 원본 키와 동일
      remoteRef:
        key: /his-main/grafana/smtp-password
