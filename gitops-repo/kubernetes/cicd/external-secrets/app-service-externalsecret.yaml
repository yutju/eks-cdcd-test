# app-service-secret (web-apps + web-apps-test) ← AWS SSM /his-main/app-service/env (JSON)
# 위치: kubernetes/cicd/external-secrets/app-service-externalsecret.yaml
#   dataFrom.extract 가 SSM의 JSON 각 키를 K8s 시크릿 키로 자동 전개.
#   원본이 두 네임스페이스에 동일하게 있으므로 ExternalSecret도 2개.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-service-secret
  namespace: web-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: app-service-secret        # Deployment/Rollout 이 envFrom 으로 참조하는 이름과 동일
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /his-main/app-service/env
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-service-secret
  namespace: web-apps-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: app-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /his-main/app-service/env

