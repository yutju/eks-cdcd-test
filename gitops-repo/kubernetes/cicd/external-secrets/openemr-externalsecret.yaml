# openemr 시크릿 ← AWS SSM /his-main/openemr/*
# 위치: kubernetes/cicd/external-secrets/openemr-externalsecret.yaml
#   ※ his-emr 네임스페이스는 부트스트랩에서 미리 생성됨(ESO가 그 안에 시크릿 생성)
---
# openemr DB env (SQL_HOST 등) — JSON blob 을 각 키로 전개
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openemr-db-secret
  namespace: his-emr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: openemr-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /his-main/openemr/db
---
# openemr sqlconf.php (파일 통째) — secretKey 가 파일명, 볼륨 마운트로 파일이 됨
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openemr-sqlconf
  namespace: his-emr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: openemr-sqlconf
    creationPolicy: Owner
  data:
    - secretKey: sqlconf.php
      remoteRef:
        key: /his-main/openemr/sqlconf-php
