apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-api
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-ssm, kind: ClusterSecretStore }
  target:
    name: gitlab-api-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: /his-main/gitlab/api-token
