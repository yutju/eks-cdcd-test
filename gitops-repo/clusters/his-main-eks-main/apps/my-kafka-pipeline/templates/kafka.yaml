# kafka.yaml
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  #replicas: 3
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    #size: 10Gi
    size: {{ .Values.kafka.storageSize }}
    class: gp3
    deleteClaim: true
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: "enabled"
    strimzi.io/kraft: "enabled"
spec:
  kafka:
    version: 4.3.0
    listeners:
      # 📍 [추가] 1. 사내망(Kafka Connect 등) 전용 뒷문 개방
      - name: internal
        port: 9093
        type: internal
        tls: false
        
      # 📍 [수정] 2. 외부망(Lambda) 전용 대문 (이름을 external로 변경)
      - name: external
        port: 9092
        type: loadbalancer
        tls: false
        # 📍 [추가] AWS Internal NLB 생성 및 Lambda 탐색용 'kafka' 태그 추가
        configuration:
          bootstrap:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
              service.beta.kubernetes.io/aws-load-balancer-internal: "0.0.0.0/0"
              service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Name=kafka-internal-nlb,app=kafka"
          brokers:
            - broker: 0
              annotations:
                service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
                service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
                service.beta.kubernetes.io/aws-load-balancer-internal: "0.0.0.0/0"
                service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Name=kafka-internal-nlb,app=kafka"
            - broker: 1
              annotations:
                service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
                service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
                service.beta.kubernetes.io/aws-load-balancer-internal: "0.0.0.0/0"
                service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Name=kafka-internal-nlb,app=kafka"
            - broker: 2
              annotations:
                service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
                service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
                service.beta.kubernetes.io/aws-load-balancer-internal: "0.0.0.0/0"
                service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Name=kafka-internal-nlb,app=kafka"
    config:
      auto.create.topics.enable: "true"
      
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml

  entityOperator:
    topicOperator: {}
    userOperator: {}

--- # 📍 핵심: 기존 코드가 끝나는 곳에 이 구분선(하이픈 3개)을 꼭 넣어주세요!

{{- /* 여기서부터 새로 추가된 수동 PV 자동 매핑 코드입니다 */ -}}
{{- if .Values.kafka.volumes }}
{{- range .Values.kafka.volumes }}
{{- if .volumeHandle }} 
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-kafka-{{ .index }}
spec:
  capacity:
    storage: {{ $.Values.kafka.storageSize | default "10Gi" }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp3
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: {{ .volumeHandle | quote }}
  claimRef:
    namespace: kafka
    name: data-my-cluster-dual-role-{{ .index }}
---
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.mysql.volumeHandle }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-mysql
spec:
  capacity:
    storage: {{ .Values.mysql.storage | default "10Gi" }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp3
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: {{ .Values.mysql.volumeHandle | quote }}
  claimRef:
    namespace: kafka
    name: mysql-pvc
{{- end }}

---

apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: vpc-flow-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 10
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics-config
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: ".*"

