apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf-log-consumer
  namespace: kafka

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pf-log-consumer

  template:
    metadata:
      labels:
        app: pf-log-consumer

    spec:
      containers:
      - name: consumer

        image: python:3.11-slim

        command:
        - /bin/sh
        - -c

        args:
        - |

          apt-get update -q && apt-get install -y -q libsnappy-dev gcc

          pip install kafka-python mysql-connector-python python-snappy -q

          python3 << 'PYEOF'

          import json
          import re
          import time

          from kafka import KafkaConsumer
          import mysql.connector


          def fix_json(raw):
              fixed = re.sub(
                  r'"message":\s*([^"][^,}\n]*)',
                  lambda m: '"message": "' +
                  m.group(1).strip().replace('"', '\\"') + '"',
                  raw
              )
              return fixed


          TOPIC_TABLE = {
              "pf-firewall-log": "pf_firewall_log",
              "pf-vpn-openvpn-log": "pf_vpn_openvpn_log",
              "pf-config-log": "pf_config_log",
              "pf-etc-log": "pf_etc_log"
          }


          while True:

              try:

                  consumer = KafkaConsumer(

                      "pf-firewall-log",
                      "pf-vpn-openvpn-log",
                      "pf-config-log",
                      "pf-etc-log",

                      bootstrap_servers=[
                          "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9093"
                      ],

                      auto_offset_reset="earliest",

                      group_id="pf-log-mysql-consumer"

                  )

                  db = mysql.connector.connect(

                      host="mysql-service",

                      user="root",

                      password="{{ .Values.mysql.rootPassword }}",

                      database="{{ .Values.mysql.databaseName }}"

                  )

                  cursor = db.cursor()

                  print("Connected!", flush=True)

                  for msg in consumer:

                      try:

                          topic = msg.topic

                          table = TOPIC_TABLE.get(topic)

                          raw = msg.value.decode("utf-8")

                          print("=" * 60, flush=True)
                          print(topic, flush=True)
                          print(raw, flush=True)
                          print("=" * 60, flush=True)

                          try:
                              event = json.loads(raw)
                          except:
                              event = json.loads(fix_json(raw))

                          cursor.execute(f"""
                              INSERT INTO {table}
                              (
                                  timestamp,
                                  host,
                                  program,
                                  pid,
                                  message,
                                  raw_event
                              )
                              VALUES
                              (
                                  %s,%s,%s,%s,%s,%s
                              )
                          """,
                          (
                              event.get("timestamp",""),
                              event.get("host",""),
                              event.get("program",""),
                              event.get("pid",""),
                              event.get("message",""),
                              json.dumps(event)
                          ))

                          db.commit()

                          print(f"Inserted -> {table}", flush=True)

                      except Exception as e:

                          print(f"Skip: {e}", flush=True)

              except Exception as e:

                  print(f"Error: {e}", flush=True)

                  time.sleep(5)

          PYEOF