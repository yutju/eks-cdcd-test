
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-1-monitoring-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 56.6.2
    helm:
      values: |
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        prometheus-node-exporter:
          enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                    - his-main-ng-kafka
                    - his-main-vdi-node-group
        kube-state-metrics:
          enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                    - his-main-ng-kafka
                    - his-main-vdi-node-group
        prometheusOperator:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                    - his-main-ng-kafka
                    - his-main-vdi-node-group
        # 프로메테우스를 가벼운 수집기(Agent)로 변경
        prometheus:
          enabled: true
          agentMode: true
          prometheusSpec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: eks.amazonaws.com/nodegroup
                      operator: In
                      values:
                      - his-main-ng-kafka
                      - his-main-vdi-node-group
            remoteWrite:
              - url: "{{ .Values.global.hubPrometheusUrl }}"
  destination:
    server: '{{ .Values.global.edgeApiUrl }}'
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
