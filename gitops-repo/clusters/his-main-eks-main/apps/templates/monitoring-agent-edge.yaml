apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-1-monitoring-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 87.2.1
    helm:
      values: |
        grafana:
          enabled: false
        alertmanager:
          enabled: true
        prometheus-node-exporter:
          enabled: true
        kube-state-metrics:
          enabled: true
        prometheusOperator:
          enabled: true
        prometheus:
          enabled: true
          agentMode: true
          prometheusSpec:
            remoteWrite:
              - url: "http://prometheus.monitoring.local:9090/api/v1/write"
                writeRelabelConfigs:
                - targetLabel: cluster
                  replacement: edge-1
  destination:
    server: '{{ required "global.edgeApiUrl is required (ApplicationSet must inject edge cluster API URL)" .Values.global.edgeApiUrl }}'
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

