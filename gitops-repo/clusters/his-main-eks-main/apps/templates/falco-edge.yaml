apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-main-falco  # 이름 충돌을 막기 위해 main용으로 변경!
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 7.0.0
    helm:
      values: |
        falco:
          jsonOutput: true  # 중앙 모니터링 연동을 위한 JSON 포맷 활성화
          jsonIncludeOutputProperty: true
          grpc:
            enabled: false
          grpcOutput:
            enabled: false
          tty: true
          collectors:
            enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate
          podSecurityContext: {}
          securityContext:
            privileged: true

        # 엣지에서 발생한 이벤트를 프로메테우스 메트릭으로 변환 (핵심!)
        falcosidekick:
          enabled: true
          webui:
            enabled: false  # 엣지 클러스터의 리소스 절약을 위해 UI는 끕니다
          config:
            prometheus:
              enabled: true
          serviceMonitor:
            enabled: true

  destination:
    server: '{{ .Values.global.edgeApiUrl }}'  # 이 변수 처리는 아주 잘하셨습니다!
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
