apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-2-monitoring-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 87.2.1
    helm:
      values: |
        grafana:
          enabled: false
        # --- Alertmanager 설정 추가 및 활성화 ---
        alertmanager:
          enabled: true
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: alertmanager-v0.33.0
          alertmanagerSpec:
            image:
              registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
              repository: vdi/pod-image
              tag: alertmanager-v0.33.0
            configReloader:
              image:
                registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
                repository: vdi/pod-image
                tag: prometheus-config-reloader-v0.92.0
        # ------------------------------------
        prometheus-node-exporter:
          enabled: true
          version: "1.8.2"
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: node-exporter-v1.8.2
        kube-state-metrics:
          enabled: true
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: kube-state-metrics-v2.13.0
        prometheusOperator:
          enabled: true
          tls:
            enabled: false
          admissionWebhooks:
            enabled: false
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: prometheus-operator-v0.79.2
          prometheusConfigReloader:
            image:
              registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
              repository: vdi/pod-image
              tag: prometheus-config-reloader-v0.79.2
        prometheus:
          enabled: true
          agentMode: true
          prometheusSpec:
            image:
              registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
              repository: vdi/pod-image
              tag: prometheus-v3.1.0
            remoteWrite:
              - url: "http://prometheus.monitoring.local:9090/api/v1/write"
                writeRelabelConfigs:
                - targetLabel: cluster
                  replacement: edge-2
  destination:
    server: '{{ .Values.global.edgeApiUrl }}'
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
