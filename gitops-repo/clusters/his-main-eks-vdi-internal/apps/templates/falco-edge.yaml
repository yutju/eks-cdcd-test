apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-vdi-falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 7.0.0
    helm:
      values: |
        image:
          registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
          repository: vdi/pod-image
          tag: falco-0.42.0
        driver:
          loader:
            initContainer:
              image:
                registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
                repository: vdi/pod-image
                tag: falco-driver-loader-0.42.0
        falcoctl:
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: falcoctl-0.11.4
          artifact:
            install:
              enabled: false
            follow:
              enabled: false
        falco:
          jsonOutput: true
          jsonIncludeOutputProperty: true
          grpc:
            enabled: false
          grpcOutput:
            enabled: false
          tty: true
          collectors:
            enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate
          podSecurityContext: {}
          securityContext:
            privileged: true
        falcosidekick:
          enabled: true
          image:
            registry: 278584440977.dkr.ecr.ap-northeast-2.amazonaws.com
            repository: vdi/pod-image
            tag: falcosidekick-2.31.0
          webui:
            enabled: false
          config:
            prometheus:
              enabled: true
            kafka:
              hostport: "a587fce1a18e44dddb5113906ef93591-dbe568beb162965a.elb.ap-northeast-2.amazonaws.com:9092"
              topic: "falco-vdi"
          serviceMonitor:
            enabled: true
  destination:
    server: '{{ required "global.edgeApiUrl is required (ApplicationSet must inject edge cluster API URL)" .Values.global.edgeApiUrl }}'
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

