apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-2-falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://falcosecurity.github.io/charts'
    chart: falco
    targetRevision: 4.10.0
    helm:
      values: |
        falco:
          jsonOutput: true
        
        # 🌟 노드 그룹 제약 제거 및 Fargate 배제 방식의 affinity 적용
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: eks.amazonaws.com/compute-type
                  operator: NotIn
                  values: [fargate]
                  
        # Falco가 커널 이벤트를 감시하기 위한 필수 권한 (Privileged)
        securityContext:
          privileged: true
  destination:
    server: '{{ .Values.global.edgeApiUrl }}'
    namespace: security
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
