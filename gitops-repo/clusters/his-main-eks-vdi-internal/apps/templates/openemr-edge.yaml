# gitops-repo/clusters/his-main-eks-vdi-internal/apps/templates/openemr-edge.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-openemr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '{{ .Values.global.gitlabUrl }}/root/gitops-repo.git'
    path: kubernetes/apps/openemr
    targetRevision: main
  destination:
    server: '{{ .Values.global.edgeApiUrl }}'   # ApplicationSet이 자동으로 VDI 클러스터 주소 주입
    namespace: his-emr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:      
    - group: apps           
      kind: Deployment      
      jsonPointers:         
        - /spec/replicas    
