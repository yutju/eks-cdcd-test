# clusters/hub/apps/templates/app-service-test-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-service-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '{{ .Values.global.gitlabUrl }}/root/gitops-repo.git'
    path: kubernetes/apps/app-service-test
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: web-apps-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # 이제 replicas도 전부 Git이 원본이라, selfHeal을 켜놔도
                         # Jenkins가 커밋한 값과 항상 일치해서 충돌이 안 남.
    syncOptions:
      - CreateNamespace=true
  # ignoreDifferences 제거함 - kubectl scale로 클러스터를 직접 건드리던 시절엔
  # 필요했지만, 이제 replicas도 Git 커밋으로만 변경하므로 드리프트 자체가 안 생김.
