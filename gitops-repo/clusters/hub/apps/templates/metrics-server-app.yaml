# clusters/hub/apps/templates/metrics-server-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-sigs.github.io/metrics-server/'
    chart: metrics-server
    targetRevision: 3.12.2 # 최신 버전 확인 필요
    helm:
      values: |
        # 🌟 인프라 노드 배치 전략 준수
        nodeSelector:
          role: infra
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "infra"
            effect: "NoSchedule"
        # Metrics API의 신뢰성 확보 (내부 네트워크 통신 환경에 따라 설정)
        args:
          - --kubelet-insecure-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
