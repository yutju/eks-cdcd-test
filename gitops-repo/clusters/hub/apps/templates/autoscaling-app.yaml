apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscaling-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: '{{ .Values.global.gitlabUrl }}/root/gitops-repo.git'
    path: kubernetes/autoscaling
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

