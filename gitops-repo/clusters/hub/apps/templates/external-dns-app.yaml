apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-sigs.github.io/external-dns/'
    chart: external-dns
    targetRevision: 1.14.3
    helm:
      values: |
        provider: aws
        aws:
          zoneType: private
        domainFilters:
          - monitoring.local
        
        serviceAccount:
          create: true
          name: external-dns
          # EKS IRSA가 역할을 인식하기 위한 어노테이션
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::278584440977:role/his-main-external-dns-role"
        
        #  설정을 깔끔하게 분리 (flag 충돌 방지)
        policy: upsert-only
        registry: txt
        txtOwnerId: my-cluster-id
        sources:
          - service
          - ingress

        #  시크릿 참조는 유지 (보안 유지)
        extraEnv:
          - name: AWS_ROLE_ARN
            valueFrom:
              secretKeyRef:
                name: external-dns-secret-k8s
                key: role-arn

        nodeSelector:
          role: infra
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "infra"
            effect: "NoSchedule"

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

