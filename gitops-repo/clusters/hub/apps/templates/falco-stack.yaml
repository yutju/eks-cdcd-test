apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 7.0.0
    helm:
      values: |
        falco:
          jsonOutput: true
          jsonIncludeOutputProperty: true
          grpc:
            enabled: false
          grpcOutput:
            enabled: false
          tty: true
          collectors:
            enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate
          # DaemonSet이라 모든 실제 노드(ng-infra + ng-service)에 떠야 하므로
          # nodeSelector/toleration 없음 (fargate만 제외)
          podSecurityContext: {}
          securityContext:
            privileged: true

        falcosidekick:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
          config:
            prometheus:
              enabled: true
            kafka:
              hostport: "a587fce1a18e44dddb5113906ef93591-dbe568beb162965a.elb.ap-northeast-2.amazonaws.com:9092"
              topic: "falco-devops"
          serviceMonitor:
            enabled: true
          webui:
            enabled: false   # falco-consumer -> Kafka -> MySQL 파이프라인과 기능 중복이라 비활성화

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

