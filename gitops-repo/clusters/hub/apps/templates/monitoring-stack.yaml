apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 87.2.1
    helm:
      values: |
        prometheusOperator:
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
          admissionWebhooks:
            patch:
              nodeSelector:
                role: infra
              tolerations:
                - key: "dedicated"
                  operator: "Equal"
                  value: "infra"
                  effect: "NoSchedule"

        grafana:
          enabled: true
          defaultDashboardsEnabled: true
          # 권한 충돌 방지를 위한 설정
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
          # 접속 문제 해결을 위한 필수 환경 변수
          env:
            GF_SERVER_ROOT_URL: "http://localhost:3000/"
            GF_SERVER_SERVE_FROM_SUB_PATH: "true"
          envFromSecret: "grafana-smtp-secret"
          persistence:
            enabled: false
          service:
            type: ClusterIP
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
          adminPassword: "army6"

          grafana.ini:
            smtp:
              enabled: true
              host: mail.army.local:25
              from_address: test@army.local
              from_name: Grafana Alert
              skip_verify: "true"
              ehlo_identity: army.local

        prometheus:
          enabled: true
          prometheusSpec:
            enableRemoteWriteReceiver: true
            nodeSelector:
              role: infra
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "infra"
                effect: "NoSchedule"
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-internal: "true"
              external-dns.alpha.kubernetes.io/hostname: "prometheus.monitoring.local"
              
        alertmanager:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
              
        kube-state-metrics:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
              
        prometheus-node-exporter:
          enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

