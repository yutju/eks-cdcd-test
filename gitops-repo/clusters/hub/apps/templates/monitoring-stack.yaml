apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 56.6.2
    helm:
      values: |
        prometheus:
          enabled: true
          prometheusSpec:
            enableRemoteWriteReceiver: true
            nodeSelector:
              role: infra
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "infra"
                effect: "NoSchedule"
          service:
            type: LoadBalancer
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
              service.beta.kubernetes.io/aws-load-balancer-internal: "true"
              external-dns.alpha.kubernetes.io/hostname: "prometheus.monitoring.local"

        grafana:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"
          # GF_SECURITY_ADMIN_PASSWORD 중복 방지: adminPassword로 직접 지정
          adminPassword: "army6"

        alertmanager:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

        kube-state-metrics:
          enabled: true
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

        prometheus-node-exporter:
          enabled: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                    - fargate

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
