apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://kubernetes.github.io/autoscaler'
    chart: cluster-autoscaler
    targetRevision: 9.43.0
    helm:
      values: |
        autoDiscovery:
          clusterName: his-main-eks-devops
        awsRegion: ap-northeast-2
        # CA는 infra 노드에 배치
        nodeSelector:
          role: infra
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "infra"
            effect: "NoSchedule"
        rbac:
          serviceAccount:
            annotations:
              # IRSA: CA가 ASG를 제어할 수 있는 IAM Role ARN
              eks.amazonaws.com/role-arn: "arn:aws:iam::278584440977:role/his-main-cluster-autoscaler-role"
        extraArgs:
          # node-group-auto-discovery는 chart가 autoDiscovery.clusterName으로
          # 자동 생성하므로 수동 지정 제거 (수동값이 잘못된 클러스터명을 덮어쓰던 문제 수정)
          scale-down-enabled: "true"
          scale-down-delay-after-add: "2m"
          scale-down-unneeded-time: "5m"
          skip-nodes-with-system-pods: "false"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
