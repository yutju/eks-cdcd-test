# clusters/hub/apps/templates/app-service-prod-app.yaml (기존 app-service-app.yaml 대체)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '{{ .Values.global.gitlabUrl }}/root/gitops-repo.git'
    path: kubernetes/apps/app-service-prod
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: web-apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ignoreDifferences=[{"group":"apps","kind":"Deployment","jsonPointers":["/spec/replicas"]}]
