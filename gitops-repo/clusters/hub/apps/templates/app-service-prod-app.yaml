# clusters/hub/apps/templates/app-service-prod-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '{{ .Values.global.gitlabUrl }}/root/gitops-repo.git'
    path: kubernetes/apps/app-service-prod
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: web-apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # ignoreDifferences 항목을 sync 시에도 덮어쓰지 않게 함 —
      # 없으면 selfHeal이 KEDA replica 수와 Rollouts의 ALB annotation을 계속 되돌림
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # KEDA가 관리하는 replica 수 (Deployment → Rollout으로 kind 변경)
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    # Argo Rollouts가 주입/관리하는 ALB 가중치 annotation — git에는 없는 게 정상
    - group: networking.k8s.io
      kind: Ingress
      jqPathExpressions:
        - .metadata.annotations."alb.ingress.kubernetes.io/actions.app-service"
