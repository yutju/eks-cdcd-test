apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.104
    helm:
      values: |
        controller:
          # 🌟 [추가] infra 노드 고정 및 테인트 허용 설정
          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

          # 🌟 [수정] 한국 시간 설정 + 플러그인 설치 타임아웃 대폭 연장 (5분)
          javaOpts: "-Duser.timezone=Asia/Seoul -DpluginManager.connectionTimeout=300000 -DpluginManager.readTimeout=300000"

          serviceType: LoadBalancer
          servicePort: 8080
          agentListenerPort: 50000
          
          serviceAnnotations:
            service.beta.kubernetes.io/aws-load-balancer-internal: "true"
            service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
            # 🌟 [추가] 노드 IP가 바뀌어도 NLB가 파드를 직접 찾아가도록 고정 설정
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

          # 🌟 [수정] 자동 설치 시도 (네트워크 환경에 맞춰 최적화)
          installLatestPlugins: true
          installLatestSpecifiedPlugins: true
          installPlugins:
            - kubernetes
            - workflow-aggregator
            - git
            - configuration-as-code
            - job-dsl
            - gitlab-plugin
            - credentials-binding
            - plain-credentials
            - aws-credentials

          admin:
            existingSecret: "jenkins-stack"
            userKey: "jenkins-admin-user"
            passwordKey: "jenkins-admin-password"

          containerEnv:
            # 🌟 [추가] 업데이트 센터 접속 실패 방지를 위한 안정적인 미러 서버 설정
            - name: JENKINS_UC
              value: "https://mirrors.tuna.tsinghua.edu.cn/jenkins/updates/update-center.json"
            - name: JENKINS_UC_EXPERIMENTAL
              value: "https://mirrors.tuna.tsinghua.edu.cn/jenkins/updates/experimental/update-center.json"
            - name: GITLAB_TOKEN_ENV
              valueFrom:
                secretKeyRef:
                  name: gitlab-api-secret
                  key: api-token
            - name: CM_GITLAB_URL
              valueFrom:
                configMapKeyRef:
                  name: jenkins-infra-config
                  key: GITLAB_URL
            - name: CM_JENKINS_IP
              valueFrom:
                configMapKeyRef:
                  name: jenkins-infra-config
                  key: JENKINS_IP
            - name: CM_JENKINS_PORT
              valueFrom:
                configMapKeyRef:
                  name: jenkins-infra-config
                  key: JENKINS_PORT
            - name: AWS_ECR_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-secret
                  key: access-key
            - name: AWS_ECR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-ecr-secret
                  key: secret-key

          JCasC:
            defaultConfig: true
            configScripts:
              all-config: |
                jenkins:
                  systemMessage: "Jenkins configured automatically by ArgoCD - Fully GitOps"
                  globalNodeProperties:
                    - envVars:
                        env:
                          - key: "GITLAB_URL"
                            value: "${CM_GITLAB_URL}"
                          - key: "JENKINS_IP"
                            value: "${CM_JENKINS_IP}"
                          - key: "JENKINS_PORT"
                            value: "${CM_JENKINS_PORT}"
                credentials:
                  system:
                    domainCredentials:
                      - credentials:
                          - string:
                              scope: GLOBAL
                              id: "gitlab-token-id"
                              secret: "${GITLAB_TOKEN_ENV}"
                          - usernamePassword:
                              scope: GLOBAL
                              id: "gitlab-checkout-cred"
                              username: "root"
                              password: "${GITLAB_TOKEN_ENV}"
                          - usernamePassword:
                              scope: GLOBAL
                              id: "aws-ecr-cred"
                              username: "${AWS_ECR_ACCESS_KEY}"
                              password: "${AWS_ECR_SECRET_KEY}"
                              description: "AWS ECR Credentials for Pipeline"
                jobs:
                  - script: >
                      pipelineJob('jenkins-test-pipeline') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${CM_GITLAB_URL}/root/app-repo.git")
                                  credentials('gitlab-checkout-cred')
                                }
                                branches('*/main')
                              }
                            }
                            scriptPath('Jenkinsfile')
                          }
                        }
                      }
                unclassified:
                  gitLabConnectionConfig:
                    connections:
                      - name: "my-gitlab"
                        url: "${CM_GITLAB_URL}"
                        apiTokenId: "gitlab-token-id"
                        clientBuilderId: "autodetect"
                        ignoreCertificateErrors: true

        agent:
          enabled: true

        persistence:
          enabled: true
          existingClaim: jenkins-pvc
          storageClass: "gp2"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
