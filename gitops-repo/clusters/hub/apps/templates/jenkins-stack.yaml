apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.104
    helm:
      values: |
        controller:
          # 커스텀 이미지 사용 (registry 분리로 docker.io prefix 방지)
          image:
            registry: "278584440977.dkr.ecr.ap-northeast-2.amazonaws.com"
            repository: "dev-apps/jenkins"
            tag: "custom"
            pullPolicy: Always

          nodeSelector:
            role: infra
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "infra"
              effect: "NoSchedule"

          javaOpts: "-Duser.timezone=Asia/Seoul"

          # [변경] 클러스터를 자주 재생성하는 환경이라, GitLab(EC2)에서 Jenkins를 호출할
          # 안정적인 주소가 필요함. 클러스터 내부 DNS(.svc.cluster.local)는 클러스터 밖(GitLab)에서
          # resolve가 안 되므로, 내부 NLB + ExternalDNS 조합으로 노출.
          # (monitoring-stack의 Prometheus에서 이미 쓰고 있는 것과 동일한 패턴)
          serviceType: LoadBalancer
          serviceAnnotations:
            service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
            service.beta.kubernetes.io/aws-load-balancer-internal: "true"
            external-dns.alpha.kubernetes.io/hostname: "jenkins.his-main.internal"
          servicePort: 8080
          agentListenerPort: 50000
          agentListenerServiceType: ClusterIP

          # 플러그인 설치 로직 완전 OFF (커스텀 이미지에 내장)
          installLatestPlugins: false
          installLatestSpecifiedPlugins: false
          installPlugins: []

          admin:
            existingSecret: "jenkins-stack"
            userKey: "jenkins-admin-user"
            passwordKey: "jenkins-admin-password"

          containerEnv:
            - name: JENKINS_UC
              value: "https://mirror.kakao.com/jenkins/updates/update-center.json"
            - name: JENKINS_UC_EXPERIMENTAL
              value: "https://mirror.kakao.com/jenkins/updates/experimental/update-center.json"
            - name: TRY_UPGRADE_IF_NO_MARKER
              value: "false"
            - name: GITLAB_TOKEN_ENV
              valueFrom: { secretKeyRef: { name: gitlab-api-secret, key: api-token } }
            # [DR] Azure Service Principal — ESO가 만든 azure-sp-secret에서 주입.
            #   JCasC credentials 블록에서 ${..._ENV} 로 참조된다.
            - name: AZURE_TENANT_ID_ENV
              valueFrom: { secretKeyRef: { name: azure-sp-secret, key: tenant-id } }
            - name: AZURE_CLIENT_ID_ENV
              valueFrom: { secretKeyRef: { name: azure-sp-secret, key: client-id } }
            - name: AZURE_CLIENT_SECRET_ENV
              valueFrom: { secretKeyRef: { name: azure-sp-secret, key: client-secret } }
            - name: CM_GITLAB_URL
              valueFrom: { configMapKeyRef: { name: jenkins-infra-config, key: GITLAB_URL } }
            - name: CM_JENKINS_IP
              valueFrom: { configMapKeyRef: { name: jenkins-infra-config, key: JENKINS_IP } }
            - name: CM_JENKINS_PORT
              valueFrom: { configMapKeyRef: { name: jenkins-infra-config, key: JENKINS_PORT } }

          sidecars:
            configAutoReload:
              enabled: true

          JCasC:
            defaultConfig: true
            configScripts:
              all-config: |
                jenkins:
                  systemMessage: "Jenkins configured automatically by ArgoCD - Fully GitOps"
                  globalNodeProperties:
                    - envVars:
                        env:
                          - key: "GITLAB_URL"
                            value: "${CM_GITLAB_URL}"
                          - key: "JENKINS_IP"
                            value: "${CM_JENKINS_IP}"
                          - key: "JENKINS_PORT"
                            value: "${CM_JENKINS_PORT}"
                credentials:
                  system:
                    domainCredentials:
                      - credentials:
                          - string:
                              scope: GLOBAL
                              id: "gitlab-token-id"
                              secret: "${GITLAB_TOKEN_ENV}"
                          - usernamePassword:
                              scope: GLOBAL
                              id: "gitlab-checkout-cred"
                              username: "root"
                              password: "${GITLAB_TOKEN_ENV}"
                          # [DR] Azure SP 3종 — openemr/Jenkinsfile 의 credentials('...') id 와 정확히 일치해야 함
                          - string:
                              scope: GLOBAL
                              id: "AZURE_TENANT_ID"
                              secret: "${AZURE_TENANT_ID_ENV}"
                              description: "Azure SP Tenant ID (DR/ACA)"
                          - string:
                              scope: GLOBAL
                              id: "AZURE_CLIENT_ID"
                              secret: "${AZURE_CLIENT_ID_ENV}"
                              description: "Azure SP Client ID (DR/ACA)"
                          - string:
                              scope: GLOBAL
                              id: "AZURE_CLIENT_SECRET"
                              secret: "${AZURE_CLIENT_SECRET_ENV}"
                              description: "Azure SP Client Secret (DR/ACA)"
                jobs:
                  - script: >
                      pipelineJob('jenkins-app-service-pipeline') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${CM_GITLAB_URL}/root/app-repo.git")
                                  credentials('gitlab-checkout-cred')
                                }
                                branches('*/main')
                              }
                            }
                            scriptPath('app-service/Jenkinsfile')
                          }
                        }
                      }
                  - script: >
                      pipelineJob('jenkins-openemr-pipeline') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${CM_GITLAB_URL}/root/app-repo.git")
                                  credentials('gitlab-checkout-cred')
                                }
                                branches('*/main')
                              }
                            }
                            scriptPath('openemr/Jenkinsfile')
                          }
                        }
                      }
                unclassified:
                  gitLabConnectionConfig:
                    connections:
                      - name: "my-gitlab"
                        url: "${CM_GITLAB_URL}"
                        apiTokenId: "gitlab-token-id"
                        clientBuilderId: "autodetect"
                        ignoreCertificateErrors: true

        agent:
          enabled: true
          namespace: jenkins

        persistence:
          enabled: true
          existingClaim: jenkins-pvc
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
